[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "company-security-portfolio-tests"
version = "0.1.0"
description = "Local-only security regression tests for the synthetic COMPANY security lab"
requires-python = ">=3.13"
dependencies = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "pydantic-settings==2.15.0",
  "pytest==9.1.1",
  "pytest-bdd==9.0.0",
  "PyYAML==6.0.3",
  "ruff==0.17.0",
  "semgrep==1.173.0",
  "types-PyYAML==6.0.12.20260815",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests/security"]
pythonpath = ["."]
xfail_strict = true
markers = [
  "security_integration: local synthetic lab API security regression",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["tests/security"]
warn_unreachable = true
