name: PR fast security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: lab-api/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: lab-api
      - run: npm run typecheck && npm run build && npm test -- --runInBand
        working-directory: lab-api
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install .
      - run: ruff check tests/security security/scripts tests/gate tests/portfolio tests/bdd
      - run: mypy tests/security tests/bdd security/scripts
      - run: pytest tests/gate tests/portfolio
      - run: python security/scripts/publication_check.py

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: |
          python security/scripts/install_ci_scanner.py gitleaks
          echo "$PWD/.ci-runtime/gitleaks" >> "$GITHUB_PATH"
      - run: |
          mkdir -p reports
          gitleaks version
          gitleaks git --no-banner --redact=100 --config .gitleaks.toml --log-opts=--all --report-format json --report-path reports/gitleaks-history.json .
          gitleaks dir --no-banner --redact=100 --config .gitleaks.toml --report-format json --report-path reports/gitleaks-tree.json .
          python security/scripts/test_gitleaks_config.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gitleaks-reports
          path: reports/gitleaks-*.json
          if-no-files-found: error
          retention-days: 7

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install semgrep==1.173.0 PyYAML==6.0.3
      - run: semgrep --validate --config semgrep.yml
      - run: python security/scripts/test_semgrep_config.py
      - run: mkdir -p reports && semgrep scan --metrics=off --error --config semgrep.yml --json --output reports/semgrep.json lab-api/src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-pr-report
          path: reports/semgrep.json
          if-no-files-found: warn
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  iac-and-filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: mkdir -p reports
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python security/scripts/install_ci_scanner.py trivy
      - run: |
          .ci-runtime/trivy/trivy --version
          .ci-runtime/trivy/trivy fs --scanners vuln,misconfig,secret --skip-dirs .git --skip-dirs .ci-runtime --skip-dirs reports --skip-dirs node_modules --skip-dirs .venv --exit-code 0 --format json --output reports/trivy-fs.json .
      - run: python -m pip install PyYAML==6.0.3
      - run: python security/scripts/normalize_scanner.py trivy reports/trivy-fs.json reports/trivy-fs.normalized.json
      - run: python security/scripts/evaluate_security_gate.py reports/trivy-fs.normalized.json --json-output reports/filesystem-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-pr-report
          path: |
            reports/trivy-fs.json
            reports/trivy-fs.normalized.json
            reports/filesystem-gate.json
          if-no-files-found: error
          retention-days: 7
