name: Portfolio native evidence

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: lab-api/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: npm --prefix lab-api ci --ignore-scripts
      - run: python -m venv .venv && .venv/bin/pip install .
      - name: Native API, regression matrix, executable Gherkin and dependency gates
        run: make ci-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-portfolio-evidence
          path: |
            reports/portfolio/index.html
            reports/portfolio/summary.json
            reports/portfolio/api.xml
            reports/portfolio/gate.xml
            reports/portfolio/jest.json
            reports/portfolio/check-*.log
            reports/portfolio/npm-audit-*-current.json
            reports/portfolio/npm-audit-current.json
            reports/bdd/results.xml
            reports/ci/result.txt
          if-no-files-found: warn
          retention-days: 7
