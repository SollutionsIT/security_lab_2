name: Release evidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-gate-attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: lab-api
          load: true
          push: false
          tags: company-security-lab:release-candidate
          provenance: false
          sbom: false
      - run: mkdir -p artifacts reports sbom
      - run: docker save company-security-lab:release-candidate --output artifacts/company-security-lab.tar
      - run: sha256sum artifacts/company-security-lab.tar > artifacts/company-security-lab.tar.sha256
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: company-security-lab:release-candidate
          format: json
          output: reports/trivy-release.json
          scanners: vuln,secret
          exit-code: "0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML==6.0.3
      - run: python security/scripts/normalize_scanner.py trivy reports/trivy-release.json reports/trivy-release.normalized.json
      - run: python security/scripts/evaluate_security_gate.py reports/trivy-release.normalized.json --json-output reports/release-gate.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: company-security-lab:release-candidate
          format: cyclonedx-json
          output-file: sbom/lab-api-release.cdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/company-security-lab.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: company-security-lab-release-evidence
          path: |
            artifacts/
            reports/
            sbom/
          if-no-files-found: error
          retention-days: 30
