version: 2
updates:
  - package-ecosystem: npm
    directory: /lab-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest-runtime:
        patterns: ["@nestjs/*"]
      development-tooling:
        dependency-type: development
    labels: [dependencies, security-review]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security-review]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, supply-chain]
