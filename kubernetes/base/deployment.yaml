apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
  namespace: company-security-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: lab-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lab-api}
    spec:
      serviceAccountName: lab-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: company-security-lab:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3001, protocol: TCP}
          env:
            - {name: NODE_ENV, value: production}
            - {name: HOST, value: 0.0.0.0}
            - {name: PORT, value: "3001"}
            - {name: JWT_ISSUER, value: company-security-lab}
            - {name: JWT_AUDIENCE, value: company-security-lab-clients}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: lab-api-runtime, key: jwt-secret}
            - name: SYNTHETIC_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: {name: lab-api-runtime, key: webhook-secret}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: temporary-files, mountPath: /tmp}
      volumes:
        - name: temporary-files
          emptyDir: {sizeLimit: 16Mi}
