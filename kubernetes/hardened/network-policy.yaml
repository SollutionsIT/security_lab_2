apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-api-default-deny-with-explicit-ingress
  namespace: company-security-lab
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: lab-api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {security.example.test/access-lab-api: "true"}
      ports:
        - {protocol: TCP, port: 3001}
  egress: []
