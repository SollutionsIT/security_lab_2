# Independent GitLab counterpart; no customer target, production secret or deployment.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
    - when: never

stages: [verify, policy, delivery]

default:
  image: python:3.13-bookworm@sha256:073ffebb96ae4d0ed73ccad59f08c47bd84af8a79f5258130f8458ac50ad9ff4
  interruptible: true
  before_script:
    - python -m venv .venv
    - .venv/bin/pip install .

native-security:
  stage: verify
  timeout: 30 minutes
  before_script:
    - python security/scripts/install_ci_node.py
    - export PATH="$CI_PROJECT_DIR/.ci-runtime/node/bin:$PATH"
    - node --version
    - python --version
    - npm --prefix lab-api ci --ignore-scripts
    - python -m venv .venv
    - .venv/bin/pip install .
  script:
    - make ci-verify
    - mkdir -p artifacts
    - tar -czf artifacts/native-build.tgz -C lab-api dist package.json package-lock.json
    - sha256sum artifacts/native-build.tgz > artifacts/native-build.tgz.sha256
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/portfolio/index.html
      - reports/portfolio/summary.json
      - reports/portfolio/jest.json
      - reports/portfolio/check-*.log
      - reports/portfolio/npm-audit-*-current.json
      - reports/portfolio/npm-audit-current.json
      - reports/ci/result.txt
      - artifacts/native-build.tgz
      - artifacts/native-build.tgz.sha256
    reports:
      junit:
        - reports/portfolio/api.xml
        - reports/portfolio/gate.xml
        - reports/bdd/results.xml

secret-scan:
  stage: verify
  timeout: 10 minutes
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  before_script: [mkdir -p reports]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --no-banner --redact --config .gitleaks.toml --report-format json --report-path reports/gitleaks-history.json .
    - gitleaks dir --no-banner --redact --config .gitleaks.toml --report-format json --report-path reports/gitleaks-tree.json .
    - |
      set +e
      gitleaks dir --no-banner --redact --config security/gitleaks-fixture.toml --report-format json --report-path reports/gitleaks-canary.json security/fixtures/secrets
      CANARY_EXIT=$?
      set -e
      test "$CANARY_EXIT" -eq 1
      test -s reports/gitleaks-canary.json
      echo "PASS: isolated non-credential canary detected"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [reports/gitleaks-history.json, reports/gitleaks-tree.json, reports/gitleaks-canary.json]

custom-sast:
  stage: verify
  timeout: 15 minutes
  script:
    - mkdir -p reports
    - .venv/bin/semgrep --validate --config semgrep.yml
    - .venv/bin/semgrep --test --config semgrep.yml security/semgrep
    - .venv/bin/semgrep scan --metrics=off --error --config semgrep.yml --json --output reports/semgrep.json lab-api/src
  artifacts:
    when: always
    expire_in: 7 days
    paths: [reports/semgrep.json]

trivy-filesystem:
  stage: verify
  timeout: 15 minutes
  image:
    name: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: [""]
  before_script: [mkdir -p reports]
  script:
    - trivy --version
    - trivy fs --scanners vuln,misconfig,secret --skip-dirs .git,.venv,node_modules,lab-api/node_modules,.ci-runtime,reports --exit-code 0 --format json --output reports/trivy-gitlab.json .
  artifacts:
    when: always
    expire_in: 7 days
    paths: [reports/trivy-gitlab.json]

scanner-policy:
  stage: policy
  timeout: 10 minutes
  needs:
    - job: trivy-filesystem
      artifacts: true
  before_script:
    - python -m pip install PyYAML==6.0.3
  script:
    - python security/scripts/normalize_scanner.py trivy reports/trivy-gitlab.json reports/trivy-gitlab.normalized.json
    - python security/scripts/evaluate_security_gate.py reports/trivy-gitlab.normalized.json --json-output reports/gitlab-scanner-gate.json
  artifacts:
    when: always
    expire_in: 7 days
    paths: [reports/trivy-gitlab.normalized.json, reports/gitlab-scanner-gate.json]

release-evidence:
  stage: delivery
  timeout: 10 minutes
  before_script: []
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  needs:
    - job: native-security
      artifacts: true
    - job: secret-scan
      artifacts: false
    - job: custom-sast
      artifacts: false
    - job: scanner-policy
      artifacts: true
  script:
    - sha256sum -c artifacts/native-build.tgz.sha256
    - echo "Verified lab build candidate retained; no registry or production deployment"
  artifacts:
    name: company-security-lab-release-candidate
    when: on_success
    expire_in: 14 days
    paths: [artifacts/native-build.tgz, artifacts/native-build.tgz.sha256, reports/gitlab-scanner-gate.json]
