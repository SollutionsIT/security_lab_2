repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff security-test lint
        entry: ruff check tests/security tests/gate security/scripts
        language: system
        pass_filenames: false
      - id: gitleaks
        name: Gitleaks repository scan
        entry: gitleaks dir --no-banner --redact=100 --config .gitleaks.toml .
        language: system
        pass_filenames: false
